:root{--bg:#111213;--surface:#1e1f22;--ink:#f2f2f2;--ink2:#bdbdbd;--ink3:#9a9a9a;--line:rgba(255,255,255,.12);
  --accent:#ff6a1a;--accentFrom:#ffa31a;--ok:#60ca5d;--warn:#d9b45c;--bad:#dd6b6f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;font:14px/1.45 'Inter',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
/* The iframe is exactly the window's size: the window fills it, the game stays visible around it. */
.win{height:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;display:flex;flex-direction:column}
.head{flex:0 0 46px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{font:800 24px/1 'SofiaX','Arial Narrow',sans-serif;letter-spacing:.5px;display:flex;align-items:center;gap:3px}
.logo b{background:var(--accent);color:var(--bg);padding:1px 5px 0;border-radius:4px}
.kick{font:700 13px/1 'SofiaC','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3)}
.x{margin-left:auto;width:32px;height:32px;border-radius:6px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-size:18px;cursor:pointer}
.x:hover{background:rgba(255,255,255,.12);color:var(--ink)}

.banner{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;border-bottom:1px solid var(--line)}
.banner .sp{flex:1}
.banner.acc{background:rgba(255,106,26,.12);color:#ffb48a}
.banner.warn{background:rgba(217,180,92,.10);color:var(--warn)}
.banner.bad{background:rgba(221,107,111,.10);color:var(--bad)}

.body{flex:1;display:flex;min-height:0}
.list{flex:0 0 290px;border-right:1px solid var(--line);padding:8px;overflow-y:auto}
.list:empty{display:none}
.list::-webkit-scrollbar,.cbody::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-track,.cbody::-webkit-scrollbar-track{background:transparent}
.list::-webkit-scrollbar-thumb,.cbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
.list::-webkit-scrollbar-thumb:hover,.cbody::-webkit-scrollbar-thumb:hover{background:rgba(255,106,26,.6)}
.dim{opacity:.45}
.sum{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 10px;color:var(--ink3);font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;position:relative;cursor:pointer}
.row:hover{background:rgba(255,255,255,.04)}
.row .n{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sel{background:rgba(255,255,255,.06)}
.row.sel:before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.r{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:12.5px;font-variant-numeric:tabular-nums}
.v{color:var(--ink2)}
.vd{color:var(--ink3)}
.arr{color:var(--ink3)}
.new{background:rgba(255,106,26,.16);color:#ff9055;font-weight:600;padding:1px 6px;border-radius:4px}
.okm{color:var(--ok);font-weight:700}
.dead{color:var(--bad);font-size:12px}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,106,26,.25);border-top-color:#ff9055;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{flex:1;min-width:0;display:flex;flex-direction:column}
.cbody{flex:1;min-height:0;overflow-y:auto;padding:20px 24px 12px}
.title{font:800 34px/1 'SofiaX','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.3px;-webkit-text-stroke:4px #000;
  paint-order:stroke fill;text-shadow:2px 2px 0 #000;margin:0}
.meta{color:var(--ink3);font-size:12.5px;margin-top:8px}
.meta b{color:#ff9055;font-weight:600}
.desc{color:var(--ink2);margin:12px 0 0;font-size:13.5px}
.kicker{font:700 13px/1 'SofiaC','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin:16px 0 8px}
.usage{padding:8px 10px;border-radius:6px;background:rgba(255,255,255,.04);color:var(--ink2);font-size:13px}
.cmds{display:flex;flex-direction:column;gap:4px}
.cmd{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid transparent;cursor:pointer}
.cmd code{font:600 12.5px/1 ui-monospace,Consolas,monospace;color:#ffb48a;background:rgba(255,106,26,.12);padding:3px 6px;border-radius:4px;flex:0 0 auto}
.cmd span{color:var(--ink2);font-size:13px;flex:1}
.cmd em{font-style:normal;color:var(--ink3);font-size:11.5px;flex:0 0 auto;visibility:hidden}
.cmd:hover{border-color:rgba(255,106,26,.45);background:rgba(255,106,26,.08)}
.cmd:hover em{visibility:visible}
.cmd.off{cursor:default;opacity:.55}
.cmd.off:hover{border-color:transparent;background:rgba(255,255,255,.04)}
.cmd.off em{visibility:hidden}
.notes{margin:0;padding-left:18px;color:var(--ink2);font-size:13px}
.notes li{margin:3px 0}
.older{margin-top:8px;display:flex;flex-direction:column}
.ver{color:var(--ink3);font-size:12.5px;padding:4px 0;border-top:1px solid var(--line);cursor:pointer}
.ver:before{content:'\25B8  '}
.ver.open:before{content:'\25BE  '}
.ver + .notes{margin:2px 0 6px}
.stl{margin-top:10px;font-size:13px;border-radius:6px;padding:8px 10px}
.stl.ok{background:rgba(96,202,93,.10);color:var(--ok)}
.stl.bad{background:rgba(221,107,111,.10);color:var(--bad)}
.stl.warn{background:rgba(217,180,92,.10);color:var(--warn)}
.stl code{font:12px ui-monospace,Consolas,monospace;color:var(--ink)}
.actions{flex:0 0 auto;padding:12px 24px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:6px;font-weight:600;font-size:13.5px;
  border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.04);white-space:nowrap;cursor:pointer;position:relative;overflow:hidden}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn.pri{border:0;color:var(--bg);background:linear-gradient(180deg,var(--accentFrom),var(--accent))}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{border:0;color:#fff;background:#c1352c}
.btn.done{border:1px solid rgba(96,202,93,.35);background:rgba(96,202,93,.08);color:var(--ok)}
.btn.prog{border:1px solid rgba(255,106,26,.5);background:rgba(255,106,26,.10);color:#ffb48a;min-width:150px;gap:8px;cursor:default}
.btn.off{opacity:.45;cursor:default;filter:none}
.btn.done.off{opacity:1}
.link{color:var(--ink3);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{color:var(--ink)}
.link.off{cursor:default;opacity:.45}
.confirm{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;background:rgba(193,53,44,.10);
  border:1px solid rgba(193,53,44,.35);font-size:13px;color:var(--ink2);flex-wrap:wrap}
.confirm .sp{flex:1;min-width:200px}
.empty{color:var(--ink3);font-size:13px;padding:6px 8px}
</style>
</head>
<body>
<div class="win">
  <div class="head"><div class="logo">ARZ<b>HUB</b></div><div class="kick">Скрипты</div><span class="x" data-act="close" data-arg="button">&times;</span></div>
  <div id="banner"></div>
  <div class="body"><div class="list" id="list"></div><div class="card" id="card"></div></div>
</div>
<script>
(() => {
  const toLua = (kind, data) => parent.postMessage({ arzhub: true, kind: kind, data: data == null ? '' : String(data) }, '*');

  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  // cjson encodes an empty array as {}, so anything that is not an array is treated as empty.
  const arr = (v) => (Array.isArray(v) ? v : []);
  const plural = (n, one, few, many) => {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  };

  const data = (o) => Object.keys(o).filter((k) => o[k] != null && o[k] !== '').map((k) => ` data-${k}="${esc(o[k])}"`).join('');
  const btn = (label, act, o) => {
    o = o || {};
    return `<span class="btn${o.cls ? ' ' + o.cls : ''}"${data({ act: act, id: o.id, arg: o.arg })}>${esc(label)}</span>`;
  };
  const link = (label, act, o) => {
    o = o || {};
    return `<span class="link${o.off ? ' off' : ''}"${data({ act: act, id: o.id })}>${esc(label)}</span>`;
  };
  const cls = (...parts) => parts.filter(Boolean).join(' ');

  const versions = (s) => {
    if (s.busy) return '<span class="spin"></span><span class="vd">скачиваю</span>';
    if (s.status === 'update') {
      return `<span class="vd">${esc(s.localVersion || '?')}</span><span class="arr">→</span><span class="new">${esc(s.version)}</span>`;
    }
    if (s.status === 'ok') return `<span class="v">${esc(s.localVersion || s.version)}</span><span class="okm">✓</span>`;
    if (s.status === 'dead') return '<span class="dead">снят с поддержки</span>';
    return '<span class="vd">не установлен</span>';
  };

  const renderList = (st, selected) => {
    const scripts = arr(st.scripts);
    let sum = '';
    const updates = scripts.filter((s) => s.status === 'update').length;
    if (st.bulk) {
      sum = `<div class="sum"><span>Обновляю ${esc(st.bulk.i)} из ${esc(st.bulk.n)}...</span></div>`;
    } else if (updates > 0) {
      sum = `<div class="sum"><span>${updates} ${plural(updates, 'обновление', 'обновления', 'обновлений')}</span>`
        + `${btn('Обновить всё', 'updateAll', { cls: cls('sm', 'pri', st.offline && 'off') })}</div>`;
    }
    const rows = scripts.map((s) => `<div class="${cls('row', s.id === selected && 'sel')}"${data({ act: 'select', id: s.id })}>`
      + `<span class="n">${esc(s.name)}</span><span class="r">${versions(s)}</span></div>`).join('');
    return `<div class="${cls('rows', st.offline && 'dim')}">${sum}${rows || '<div class="empty">Список пуст.</div>'}</div>`;
  };

  const metaLine = (s) => {
    const lv = esc(s.localVersion || '?');
    if (s.status === 'update') return `Установлена ${lv} · доступна <b>${esc(s.version)}</b>`;
    if (s.status === 'ok') return `Установлена ${lv} · последняя`;
    if (s.status === 'dead') return `Установлена ${lv} · больше не обновляется`;
    return `Не установлен · ${esc(s.version)}`;
  };

  const renderChangelog = (s, open) => {
    const list = arr(s.changelog).filter((v) => v && v.version);
    if (!list.length) return '';
    const notes = (v) => `<ul class="notes">${arr(v.notes).map((n) => `<li>${esc(n)}</li>`).join('')}</ul>`;
    const latest = list[list.length - 1];
    let out = `<div class="kicker">Что нового в ${esc(latest.version)}</div>${notes(latest)}`;
    const older = list.slice(0, -1).reverse();
    if (older.length) {
      out += '<div class="older">' + older.map((v) => {
        const isOpen = !!(open && open[v.version]);
        return `<div class="${cls('ver', isOpen && 'open')}"${data({ act: 'notes', id: s.id, arg: v.version })}>${esc(v.version)}</div>`
          + (isOpen ? notes(v) : '');
      }).join('') + '</div>';
    }
    return out;
  };

  const renderActions = (s, st, ui) => {
    if (ui.confirm === s.id) {
      return `<div class="actions"><div class="confirm"><span class="sp">Удалить ${esc(s.name)}? Скрипт выгрузится сразу, настройки останутся.</span>`
        + `${btn('Удалить', 'delete', { cls: 'sm danger', id: s.id })}${btn('Отмена', 'cancelDelete', { cls: 'sm', id: s.id })}</div></div>`;
    }
    // Nothing else may start while the manager replaces its own file.
    const off = !!st.offline || !!(st.manager && st.manager.busy);
    const busy = !!s.busy;
    const installed = s.status !== 'missing';
    const parts = [];
    if (s.twoCopies && !busy) parts.push(btn('Оставить новую', 'keepNew', { cls: cls('pri', off && 'off'), id: s.id }));
    const failed = s.result && s.result.ok === false && (s.status === 'update' || s.status === 'missing');
    if (busy) {
      // A script downloads in about a second: a spinner says enough, a percentage would only cost state pushes.
      parts.push(`<span class="btn prog"${data({ act: 'none' })}><span class="spin"></span><span>Скачиваю...</span></span>`);
    } else if (failed) {
      parts.push(btn('Повторить', s.status === 'missing' ? 'install' : 'update', { cls: cls('pri', off && 'off'), id: s.id }));
      parts.push(s.page ? link('Скачать вручную', 'open', { id: s.id, off: off }) : link('Скачать вручную', 'releases'));
    } else if (s.status === 'missing') {
      parts.push(btn('Установить', 'install', { cls: cls('pri', off && 'off'), id: s.id }));
    } else if (s.status === 'update') {
      parts.push(btn('Обновить до ' + s.version, 'update', { cls: cls('pri', off && 'off'), id: s.id }));
    } else if (s.status === 'ok') {
      parts.push(btn('Последняя версия', 'none', { cls: 'done off' }));
    }
    if (installed) parts.push(btn('Удалить', 'askDelete', { cls: cls(s.status === 'dead' && 'danger', (busy || off) && 'off'), id: s.id }));
    if (s.page) parts.push(link('Страница на сайте', 'open', { id: s.id, off: off }));
    return `<div class="actions">${parts.join('')}</div>`;
  };

  const renderCard = (s, st, ui) => {
    if (!s) return '';
    let out = `<h3 class="title">${esc(s.name)}</h3><div class="meta">${metaLine(s)}</div>`;
    if (s.result && s.result.text) {
      out += s.result.ok ? `<div class="stl ok">✓ ${esc(s.result.text)}</div>` : `<div class="stl bad">${esc(s.result.text)}</div>`;
    }
    if (s.twoCopies) {
      out += `<div class="stl warn">Найдены две копии: <code>${esc(s.twoCopies.old)}</code> и <code>${esc(s.twoCopies.new)}</code>. `
        + 'Обе запущены и мешают друг другу.</div>';
    }
    if (s.status === 'dead') {
      out += '<div class="stl bad">Поддержка прекращена: после обновлений сервера скрипт может работать неправильно. Лучше удалить.</div>';
    }
    if (s.description) out += `<p class="desc">${esc(s.description)}</p>`;
    if (s.usage) out += `<div class="kicker">Как работает</div><div class="usage">${esc(s.usage)}</div>`;
    const cmds = arr(s.commands).filter((c) => c && c.cmd);
    if (cmds.length) {
      const offCmd = s.status === 'missing' || !!st.offline;
      out += '<div class="kicker">Команды</div><div class="cmds">' + cmds.map((c) => `<div class="${cls('cmd', offCmd && 'off')}"`
        + `${data({ act: 'run', id: s.id, arg: c.cmd })}><code>${esc(c.cmd)}</code><span>${esc(c.desc)}</span><em>выполнить</em></div>`).join('') + '</div>';
    }
    out += renderChangelog(s, ui.open[s.id]);
    // Only the content scrolls: the buttons stay in sight however long the card is.
    return `<div class="cbody">${out}</div>` + renderActions(s, st, ui);
  };

  const renderBanner = (st) => {
    const bars = [];
    if (st.noList) {
      bars.push(`<div class="banner warn"><span class="sp">Нет связи со списком скриптов.</span>${btn('Повторить', 'retry', { cls: 'sm' })}</div>`);
    } else if (st.offline) {
      bars.push(`<div class="banner warn"><span class="sp">Нет связи со списком скриптов. Список от ${esc(st.offline.since)}, установка недоступна.</span>`
        + `${btn('Повторить', 'retry', { cls: 'sm' })}</div>`);
    }
    const m = st.manager || {};
    if (m.busy) {
      bars.push('<div class="banner acc"><span class="spin"></span><span class="sp">Обновляю менеджер...</span></div>');
    } else if (m.result && m.result.ok === false) {
      bars.push(`<div class="banner bad"><span class="sp">${esc(m.result.text)}</span>${btn('Повторить', 'selfUpdate', { cls: 'sm' })}</div>`);
    } else if (m.result && m.result.ok) {
      bars.push(`<div class="banner acc"><span class="sp">${esc(m.result.text)}</span></div>`);
    } else if (m.update) {
      bars.push('<div class="banner acc"><span class="sp">Вышла новая версия менеджера</span>'
        + `${btn('Обновить до ' + m.update, 'selfUpdate', { cls: cls('sm', 'pri', st.offline && 'off') })}</div>`);
    }
    return bars.join('');
  };

  // Pure: state and local view choices in, three HTML strings and the shown script out.
  const render = (st, ui) => {
    if (!st) return { banner: '', list: '<div class="empty">Загружаю список...</div>', card: '' };
    const scripts = arr(st.scripts);
    const selected = scripts.some((s) => s.id === ui.selected) ? ui.selected : (scripts[0] && scripts[0].id);
    return {
      selected: selected,
      banner: renderBanner(st),
      list: st.noList ? '' : renderList(st, selected),
      card: st.noList ? '' : renderCard(scripts.find((s) => s.id === selected), st, ui),
    };
  };

  const GLOBAL = { updateAll: true, selfUpdate: true, retry: true, releases: true };

  // A clicked element to [kind, data]; null for inactive elements. select/notes/askDelete/cancelDelete stay in the page.
  const actionFor = (node) => {
    const a = node && node.closest ? node.closest('[data-act]') : null;
    if (!a || a.classList.contains('off')) return null;
    const act = a.dataset.act;
    const id = a.dataset.id || '';
    const arg = a.dataset.arg || '';
    if (act === 'none') return null;
    if (act === 'run' || act === 'notes') return [act, id + '|' + arg];
    if (act === 'close') return ['close', arg || 'button'];
    if (GLOBAL[act]) return [act, ''];
    return [act, id];
  };

  let state = null;
  const ui = { selected: null, open: {}, confirm: null };
  const $ = (id) => document.getElementById(id);
  let shown = null;
  // New markup replaces the scrolling boxes, so their offsets are carried over; another script starts at the top.
  const paint = () => {
    const r = render(state, ui);
    const list = $('list'), card = $('card');
    const listTop = list.scrollTop;
    const old = card.querySelector('.cbody');
    const cardTop = old && r.selected === shown ? old.scrollTop : 0;
    $('banner').innerHTML = r.banner;
    list.innerHTML = r.list;
    card.innerHTML = r.card;
    list.scrollTop = listTop;
    const body = card.querySelector('.cbody');
    if (body) body.scrollTop = cardTop;
    shown = r.selected;
  };

  document.addEventListener('click', (e) => {
    const r = actionFor(e.target);
    if (!r) return;
    const kind = r[0], arg = r[1];
    if (kind === 'select') {
      ui.selected = arg;
      ui.confirm = null;
    } else if (kind === 'notes') {
      const i = arg.indexOf('|');
      const id = arg.slice(0, i), v = arg.slice(i + 1);
      ui.open[id] = ui.open[id] || {};
      ui.open[id][v] = !ui.open[id][v];
    } else if (kind === 'askDelete') {
      ui.confirm = arg;
    } else if (kind === 'cancelDelete') {
      ui.confirm = null;
    } else {
      if (kind === 'delete') ui.confirm = null;
      toLua(kind, arg);
      return;
    }
    paint();
  });
  addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.arzhubIn !== true || d.kind !== 'state') return;
    try { state = JSON.parse(d.data); } catch (err) { return; }
    paint();
  });

  toLua('stat', '');
  setInterval(() => toLua('stat', ''), 1000);
  paint();
  window.__arzHubPage = { render: render, esc: esc, actionFor: actionFor, plural: plural };
})();
</script>
</body>
</html>
